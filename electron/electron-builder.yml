appId: com.joanybuclon.streamshare
productName: StreamShare
copyright: © Joany Buclon

directories:
  output: release

# esbuild output + the manifest, and nothing else. The negation matters: electron-builder walks
# up to the repo root and pulls in ITS production dependencies (astro, tailwindcss and their
# whole tree — 7300 files, 118 MB) which have no business in a desktop app. Everything we need
# at runtime is bundled into out/main.cjs, so no node_modules ships at all.
files:
  - out/**/*
  - package.json
  - '!node_modules/**'

# The Astro build, served over app:// by main.ts (process.resourcesPath/dist when packaged).
extraResources:
  - from: ../dist
    to: dist
  # WASAPI process-loopback addon, for per-app audio. The bare .node only: the package's own
  # dist/index.cjs finds this same file through the `bindings` package, so requiring it the normal
  # way would drag a node_modules tree into the installer and break the `files:` rule above.
  # main.ts requires this path directly instead — no asar, no asarUnpack, no pnpm symlinks.
  - from: node_modules/loopback-capture/build/Release/loopback_capture_addon.node
    to: loopback_capture_addon.node

win:
  target: nsis
  # Unsigned for now (assumed decision): SmartScreen warns on first install. Documented on /download.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # No spaces in the artefact name, and this is load-bearing, not cosmetic. By default
  # electron-builder writes "StreamShare Setup x.y.z.exe" on disk but records the URL-safe
  # "StreamShare-Setup-x.y.z.exe" in latest.yml. We upload with `gh release upload`, and GitHub
  # replaces spaces with DOTS — so the asset lands as "StreamShare.Setup.x.y.z.exe" and the
  # updater 404s on a name nobody ever created. Same trap for the .blockmap.
  # (electron-builder's own publisher hides this by uploading the hyphenated name itself; we
  # don't use it, see the split build/upload in .github/workflows/docker-publish.yml.)
  artifactName: ${productName}-Setup-${version}.${ext}

# electron-updater reads this to find latest.yml + the .exe on the matching GitHub Release.
# releaseType: release publishes immediately — a `draft` (the default) is excluded from
# /releases/latest and from the updater's "latest release" lookup, silently breaking both.
publish:
  provider: github
  owner: JoanyBuclon
  repo: Stream-Share
  releaseType: release
