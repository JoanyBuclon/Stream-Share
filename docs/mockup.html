  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"dc9be469-08b6-47a4-843e-4cd30da73ff1\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"69535ff5-98f0-4155-9d48-18dfa292487a\"><\u002Fscript>\n<style>\n  * { margin:0; padding:0; box-sizing:border-box; }\n  html, body { height:100%; background:#0a0a0a; }\n  body { font-family:'Hanken Grotesk', system-ui, sans-serif; color:#ededed; -webkit-font-smoothing:antialiased; overflow:hidden; }\n  a { color:#ededed; text-decoration:none; }\n  a:hover { color:#ffffff; }\n  ::selection { background:#ededed; color:#0a0a0a; }\n  input { font-family:inherit; }\n  input:focus { outline:none; }\n  @keyframes ssPulse { 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.35; transform:scale(.82);} }\n  @keyframes ssFade { from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }\n  @keyframes ssScrim { from{ opacity:0;} to{ opacity:1;} }\n  @keyframes ssModal { from{ opacity:0; transform:translateY(10px) scale(.99);} to{ opacity:1; transform:translateY(0) scale(1);} }\n  @keyframes ssSpin { to { transform:rotate(360deg); } }\n  .ss-mono { font-family:'JetBrains Mono', monospace; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"position:fixed; inset:0; background:#0a0a0a; display:flex; flex-direction:column;\">\n\n  <!-- ===== PROTOTYPE SWITCHER (contextual) ===== -->\n  <div style=\"position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:140; display:flex; align-items:center; flex-wrap:wrap; justify-content:center; gap:2px; max-width:92vw; padding:4px 6px; background:rgba(18,18,18,.86); border:1px solid rgba(255,255,255,.09); border-radius:16px; backdrop-filter:blur(12px);\">\n    <span class=\"ss-mono\" style=\"font-size:10px; letter-spacing:.08em; color:#6a6a6a; padding:0 8px 0 4px;\">screen<\u002Fspan>\n    <sc-for list=\"{{ navMain }}\" as=\"nav\" hint-placeholder-count=\"4\">\n      <button onclick=\"{{ nav.onClick }}\" style=\"{{ nav.style }}\" class=\"ss-mono\">{{ nav.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n    <sc-if value=\"{{ hasSub }}\" hint-placeholder-val=\"{{ false }}\">\n      <span style=\"display:inline-flex; align-items:center; gap:2px;\">\n        <span style=\"width:1px; height:16px; background:rgba(255,255,255,.12); margin:0 6px;\"><\u002Fspan>\n        <span class=\"ss-mono\" style=\"font-size:10px; letter-spacing:.08em; color:#6a6a6a; padding:0 6px 0 0;\">state<\u002Fspan>\n        <sc-for list=\"{{ navSub }}\" as=\"sub\" hint-placeholder-count=\"3\">\n          <button onclick=\"{{ sub.onClick }}\" style=\"{{ sub.style }}\" class=\"ss-mono\">{{ sub.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fspan>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <!-- ============================================================ HOME -->\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <div data-screen-label=\"home\" style=\"flex:1; display:flex; flex-direction:column; animation:ssFade .4s ease both;\">\n    <header style=\"display:flex; align-items:center; justify-content:space-between; padding:26px 40px;\">\n      <div style=\"display:flex; align-items:center; gap:10px;\">\n        <span style=\"width:9px; height:9px; border-radius:50%; background:#f0f0ee; display:inline-block;\"><\u002Fspan>\n        <span style=\"font-weight:600; letter-spacing:-.01em;\">stream share<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div style=\"flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 40px; max-width:1180px; width:100%; margin:0 auto;\">\n      <div style=\"max-width:640px; margin-bottom:56px;\">\n        <div class=\"ss-mono\" style=\"font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#6a6a6a; margin-bottom:20px;\">screen sharing, direct<\u002Fdiv>\n        <h1 style=\"font-size:64px; line-height:1.02; font-weight:600; letter-spacing:-.03em; text-wrap:balance;\">Share your screen<br>with a single code.<\u002Fh1>\n        <p style=\"margin-top:22px; font-size:17px; line-height:1.6; color:#9a9a9a; max-width:520px;\">No install, no account, no server in the middle. Your screen streams straight from your machine to your friends — at whatever resolution and framerate you choose.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:18px; max-width:840px;\">\n        <!-- start -->\n        <button onclick=\"{{ startShare }}\" style=\"text-align:left; background:#f2f2f0; color:#0a0a0a; border:none; border-radius:16px; padding:28px 28px 24px; cursor:pointer; display:flex; flex-direction:column; gap:14px; min-height:190px; transition:transform .15s ease;\" style-hover=\"transform:translateY(-3px);\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; width:100%;\">\n            <span style=\"width:32px; height:32px; border-radius:9px; background:#0a0a0a; display:flex; align-items:center; justify-content:center;\"><span style=\"width:12px; height:12px; border:2px solid #f2f2f0; border-radius:3px; display:block;\"><\u002Fspan><\u002Fspan>\n            <span class=\"ss-mono\" style=\"font-size:12px; color:#6a6a6a;\">↗<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto;\">\n            <div style=\"font-size:22px; font-weight:600; letter-spacing:-.01em;\">Start a share<\u002Fdiv>\n            <div style=\"font-size:14px; color:#5a5a5a; margin-top:4px;\">Create a room and a link to send<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fbutton>\n\n        <!-- join -->\n        <div style=\"background:#131313; border:1px solid rgba(255,255,255,.09); border-radius:16px; padding:28px; display:flex; flex-direction:column; gap:14px; min-height:190px;\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between;\">\n            <span style=\"width:32px; height:32px; border-radius:9px; background:#1e1e1e; display:flex; align-items:center; justify-content:center;\"><span style=\"width:14px; height:10px; border:2px solid #9a9a9a; border-radius:3px; display:block;\"><\u002Fspan><\u002Fspan>\n            <span class=\"ss-mono\" style=\"font-size:12px; color:#6a6a6a;\">join<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto;\">\n            <div style=\"font-size:22px; font-weight:600; letter-spacing:-.01em; margin-bottom:14px;\">Join a share<\u002Fdiv>\n            <div style=\"display:flex; gap:8px;\">\n              <input class=\"ss-mono\" value=\"{{ joinValue }}\" oninput=\"{{ onJoinInput }}\" placeholder=\"code (e.g. 7K2-QP9)\" maxlength=\"9\" style=\"flex:1; background:#0a0a0a; border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:12px 14px; color:#ededed; font-size:15px; letter-spacing:.16em; text-transform:uppercase;\" style-focus=\"border-color:rgba(255,255,255,.32);\">\n              <button onclick=\"{{ joinShare }}\" style=\"background:#232323; color:#ededed; border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:0 18px; cursor:pointer; font-size:14px; font-weight:500;\" style-hover=\"background:#2c2c2c;\">→<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ joinError }}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"ss-mono\" style=\"font-size:11px; color:#f45b5b; margin-top:8px;\">invalid code — 6 characters expected<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <footer class=\"ss-mono\" style=\"display:flex; align-items:center; justify-content:space-between; padding:22px 40px; font-size:11px; color:#5a5a5a; border-top:1px solid rgba(255,255,255,.05);\">\n      <span>webRTC · direct connection<\u002Fspan>\n      <span>stream share — v0.1<\u002Fspan>\n    <\u002Ffooter>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============================================================ JOIN (via link / nickname) -->\n  <sc-if value=\"{{ isJoin }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"join\" style=\"flex:1; display:flex; align-items:center; justify-content:center; padding:40px; animation:ssFade .4s ease both;\">\n    <div style=\"width:100%; max-width:420px;\">\n      <div style=\"display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:30px;\">\n        <span style=\"width:9px; height:9px; border-radius:50%; background:#f0f0ee; display:inline-block;\"><\u002Fspan>\n        <span style=\"font-weight:600;\">stream share<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#131313; border:1px solid rgba(255,255,255,.09); border-radius:18px; padding:30px;\">\n        <div class=\"ss-mono\" style=\"font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#6a6a6a; margin-bottom:10px;\">you're joining a share<\u002Fdiv>\n        <div class=\"ss-mono\" style=\"font-size:30px; letter-spacing:.16em; font-weight:500; margin-bottom:26px;\">{{ joinCode }}<\u002Fdiv>\n\n        <label style=\"font-size:13px; color:#9a9a9a; display:block; margin-bottom:8px;\">Your nickname<\u002Flabel>\n        <input class=\"ss-join-input\" value=\"{{ pseudo }}\" oninput=\"{{ onPseudo }}\" placeholder=\"e.g. joany\" maxlength=\"20\" style=\"width:100%; background:#0a0a0a; border:1px solid rgba(255,255,255,.14); border-radius:11px; padding:13px 15px; color:#ededed; font-size:16px; margin-bottom:16px;\" style-focus=\"border-color:rgba(255,255,255,.34);\">\n\n        <button onclick=\"{{ doJoin }}\" style=\"{{ joinBtnStyle }}\">Join the stream<\u002Fbutton>\n        <div class=\"ss-mono\" style=\"font-size:11px; color:#6a6a6a; margin-top:14px; text-align:center; line-height:1.5;\">audio starts after you join<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:center; margin-top:18px;\">\n        <a href=\"#\" onclick=\"{{ backHome }}\" class=\"ss-mono\" style=\"font-size:12px; color:#7a7a7a;\">← back to home<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============================================================ HOST -->\n  <sc-if value=\"{{ isHost }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"host\" style=\"flex:1; display:flex; flex-direction:column; min-height:0; animation:ssFade .4s ease both;\">\n    <!-- top bar -->\n    <header style=\"display:flex; align-items:center; justify-content:space-between; padding:14px 22px; border-bottom:1px solid rgba(255,255,255,.07); flex-shrink:0;\">\n      <div style=\"display:flex; align-items:center; gap:18px;\">\n        <div style=\"display:flex; align-items:center; gap:9px;\">\n          <span style=\"width:8px; height:8px; border-radius:50%; background:#f0f0ee;\"><\u002Fspan>\n          <span style=\"font-weight:600; font-size:14px;\">stream share<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hostLive }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; align-items:center; gap:7px; padding:5px 11px; background:rgba(244,91,91,.12); border:1px solid rgba(244,91,91,.3); border-radius:999px;\">\n            <span style=\"width:7px; height:7px; border-radius:50%; background:#f45b5b; animation:ssPulse 1.6s ease-in-out infinite;\"><\u002Fspan>\n            <span class=\"ss-mono\" style=\"font-size:11px; color:#f4a0a0; letter-spacing:.06em;\">LIVE · {{ elapsed }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hostPaused }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; align-items:center; gap:7px; padding:5px 11px; background:rgba(232,197,106,.12); border:1px solid rgba(232,197,106,.28); border-radius:999px;\">\n            <span style=\"width:7px; height:9px; border-left:2px solid #e8c56a; border-right:2px solid #e8c56a; display:block;\"><\u002Fspan>\n            <span class=\"ss-mono\" style=\"font-size:11px; color:#e8c56a; letter-spacing:.06em;\">PAUSED<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <!-- room code = copy link (whole chip) -->\n      <button onclick=\"{{ copyLink }}\" class=\"ss-mono\" style=\"display:flex; align-items:center; gap:14px; background:#161616; border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:8px 14px; cursor:pointer; color:#ededed;\" style-hover=\"background:#1d1d1d; border-color:rgba(255,255,255,.2);\">\n        <span style=\"font-size:15px; letter-spacing:.18em; font-weight:500;\">{{ code }}<\u002Fspan>\n        <span style=\"width:1px; height:16px; background:rgba(255,255,255,.12);\"><\u002Fspan>\n        <span style=\"font-size:12px; color:{{ copyLinkColor }};\">{{ copyLinkLabel }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fheader>\n\n    <!-- body: stage + sidebar -->\n    <div style=\"flex:1; display:flex; min-height:0;\">\n      <!-- stage -->\n      <div style=\"flex:1; display:flex; flex-direction:column; min-width:0; padding:22px; gap:14px;\">\n        <div style=\"flex:1; position:relative; border-radius:14px; overflow:hidden; background:#000; border:1px solid rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center;\">\n          <sc-if value=\"{{ hostLive }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position:absolute; inset:0;\">\n              <x-import component-from-global-scope=\"image-slot\" id=\"host-stage\" shape=\"rect\" fit=\"cover\" placeholder=\"captured stream preview — drop a screenshot\" hint-size=\"100%,100%\"><\u002Fx-import>\n            <\u002Fdiv>\n            <div style=\"position:absolute; top:14px; left:14px; display:flex; gap:8px; pointer-events:none;\">\n              <span class=\"ss-mono\" style=\"font-size:11px; padding:5px 10px; background:rgba(10,10,10,.7); border-radius:7px; color:#cfcfcf; backdrop-filter:blur(6px);\">{{ sourceName }}<\u002Fspan>\n              <span class=\"ss-mono\" style=\"font-size:11px; padding:5px 10px; background:rgba(10,10,10,.7); border-radius:7px; color:#cfcfcf; backdrop-filter:blur(6px);\">{{ resolution }} · {{ fps }}fps · {{ bitrate }}mbps<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hostPaused }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"text-align:center; max-width:380px; padding:30px;\">\n              <div style=\"width:56px; height:56px; margin:0 auto 20px; border-radius:14px; background:#161616; border:1px solid rgba(232,197,106,.24); display:flex; align-items:center; justify-content:center; gap:4px;\">\n                <span style=\"width:5px; height:18px; background:#e8c56a; border-radius:2px; display:block;\"><\u002Fspan><span style=\"width:5px; height:18px; background:#e8c56a; border-radius:2px; display:block;\"><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:19px; font-weight:600; margin-bottom:8px;\">Sharing paused<\u002Fdiv>\n              <div style=\"font-size:14px; color:#8a8a8a; line-height:1.55; margin-bottom:22px;\">Your friends stay in the room — they see a waiting screen. Resume whenever you want.<\u002Fdiv>\n              <button onclick=\"{{ togglePause }}\" style=\"background:#f2f2f0; color:#0a0a0a; border:none; border-radius:10px; padding:12px 22px; font-size:14px; font-weight:600; cursor:pointer;\" style-hover=\"background:#ffffff;\">Resume sharing<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hostEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"text-align:center; max-width:400px; padding:30px;\">\n              <div style=\"width:56px; height:56px; margin:0 auto 20px; border-radius:14px; background:#161616; border:1px solid rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center;\">\n                <span style=\"width:22px; height:16px; border:2px solid #7a7a7a; border-radius:4px; display:block;\"><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:19px; font-weight:600; margin-bottom:8px;\">No source selected<\u002Fdiv>\n              <div style=\"font-size:14px; color:#8a8a8a; line-height:1.55; margin-bottom:22px;\">Open the settings to pick a screen, window or tab and tune the quality before you go live.<\u002Fdiv>\n              <button onclick=\"{{ openPicker }}\" style=\"background:#f2f2f0; color:#0a0a0a; border:none; border-radius:10px; padding:12px 22px; font-size:14px; font-weight:600; cursor:pointer;\" style-hover=\"background:#ffffff;\">Choose source<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- HOST CONTROL BAR -->\n        <div style=\"display:flex; align-items:center; gap:10px; padding:12px 14px; background:#131313; border:1px solid rgba(255,255,255,.08); border-radius:14px; flex-wrap:wrap;\">\n          <button onclick=\"{{ openPicker }}\" style=\"display:flex; align-items:center; gap:8px; background:#1d1d1d; border:1px solid rgba(255,255,255,.1); border-radius:9px; padding:9px 13px; color:#ededed; cursor:pointer; font-size:13px; font-weight:500; max-width:230px;\" style-hover=\"background:#262626;\">\n            <span style=\"width:13px; height:10px; border:1.5px solid #cfcfcf; border-radius:2px; display:block; flex-shrink:0;\"><\u002Fspan>\n            <span style=\"overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ sourceBtnLabel }}<\u002Fspan>\n          <\u002Fbutton>\n\n          <div style=\"width:1px; height:26px; background:rgba(255,255,255,.09);\"><\u002Fdiv>\n\n          <!-- quality quick view -> opens settings -->\n          <div class=\"ss-mono\" style=\"display:flex; align-items:center; gap:6px;\">\n            <span onclick=\"{{ openPicker }}\" style=\"cursor:pointer; font-size:12px; padding:8px 11px; background:#181818; border:1px solid rgba(255,255,255,.08); border-radius:8px; color:#cfcfcf;\">{{ resolution }}<\u002Fspan>\n            <span onclick=\"{{ openPicker }}\" style=\"cursor:pointer; font-size:12px; padding:8px 11px; background:#181818; border:1px solid rgba(255,255,255,.08); border-radius:8px; color:#cfcfcf;\">{{ fps }} fps<\u002Fspan>\n            <span onclick=\"{{ openPicker }}\" style=\"cursor:pointer; font-size:12px; padding:8px 11px; background:#181818; border:1px solid rgba(255,255,255,.08); border-radius:8px; color:#cfcfcf;\">{{ bitrate }} mbps<\u002Fspan>\n          <\u002Fdiv>\n\n          <button onclick=\"{{ openPicker }}\" style=\"display:flex; align-items:center; gap:7px; background:#1d1d1d; border:1px solid rgba(255,255,255,.1); border-radius:9px; padding:9px 13px; color:#ededed; cursor:pointer; font-size:13px;\" style-hover=\"background:#262626;\">\n            <span style=\"width:12px; height:12px; border:1.5px solid #cfcfcf; border-radius:50%; display:block;\"><\u002Fspan>\n            Settings\n          <\u002Fbutton>\n\n          <div style=\"flex:1;\"><\u002Fdiv>\n\n          <sc-if value=\"{{ hostSharing }}\" hint-placeholder-val=\"{{ false }}\">\n            <button onclick=\"{{ togglePause }}\" style=\"display:flex; align-items:center; gap:8px; background:#1d1d1d; border:1px solid rgba(255,255,255,.1); border-radius:9px; padding:9px 15px; color:#ededed; cursor:pointer; font-size:13px; font-weight:500;\" style-hover=\"background:#262626;\">\n              <span style=\"{{ pauseGlyph }}\"><\u002Fspan>\n              {{ pauseLabel }}\n            <\u002Fbutton>\n            <button onclick=\"{{ stopSharing }}\" style=\"display:flex; align-items:center; gap:8px; background:rgba(244,91,91,.14); border:1px solid rgba(244,91,91,.32); border-radius:9px; padding:9px 15px; color:#f4a0a0; cursor:pointer; font-size:13px; font-weight:600;\" style-hover=\"background:rgba(244,91,91,.22);\">\n              <span style=\"width:10px; height:10px; background:#f45b5b; border-radius:2px; display:block;\"><\u002Fspan>\n              Stop\n            <\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SIDEBAR: viewers -->\n      <aside style=\"width:300px; flex-shrink:0; border-left:1px solid rgba(255,255,255,.07); display:flex; flex-direction:column; padding:20px; gap:14px;\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between;\">\n          <div style=\"font-size:14px; font-weight:600;\">Viewers<\u002Fdiv>\n          <span class=\"ss-mono\" style=\"font-size:12px; color:#8a8a8a;\">{{ viewerCount }} connected<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; gap:9px; padding:11px 12px; background:rgba(232,197,106,.06); border:1px solid rgba(232,197,106,.16); border-radius:10px;\">\n          <span style=\"color:#e8c56a; font-size:12px; line-height:1.3; flex-shrink:0;\">◈<\u002Fspan>\n          <div class=\"ss-mono\" style=\"font-size:10.5px; line-height:1.5; color:#b8a878;\">In P2P, each viewer is an extra outgoing stream from your machine — more viewers can reduce performance.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasViewers }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; flex-direction:column; gap:6px;\">\n            <sc-for list=\"{{ viewers }}\" as=\"v\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; align-items:center; gap:11px; padding:9px 10px; background:#131313; border:1px solid rgba(255,255,255,.06); border-radius:10px;\">\n                <span class=\"ss-mono\" style=\"width:30px; height:30px; border-radius:8px; background:#222; display:flex; align-items:center; justify-content:center; font-size:11px; color:#cfcfcf; flex-shrink:0;\">{{ v.initials }}<\u002Fspan>\n                <div style=\"flex:1; min-width:0;\">\n                  <div style=\"font-size:13px; font-weight:500;\">{{ v.name }}<\u002Fdiv>\n                  <div class=\"ss-mono\" style=\"font-size:10px; color:#6a6a6a;\">{{ v.ping }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex; gap:4px;\">\n                  <button onclick=\"{{ v.kick }}\" title=\"kick\" class=\"ss-mono\" style=\"font-size:10px; padding:5px 8px; background:#232323; border:1px solid rgba(255,255,255,.08); border-radius:6px; color:#9a9a9a; cursor:pointer;\" style-hover=\"background:#2c2c2c; color:#ededed;\">kick<\u002Fbutton>\n                  <button onclick=\"{{ v.ban }}\" title=\"ban\" class=\"ss-mono\" style=\"font-size:10px; padding:5px 8px; background:rgba(244,91,91,.1); border:1px solid rgba(244,91,91,.24); border-radius:6px; color:#f4a0a0; cursor:pointer;\" style-hover=\"background:rgba(244,91,91,.2);\">ban<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ noViewers }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; border:1px dashed rgba(255,255,255,.1); border-radius:12px; padding:26px 20px;\">\n            <div style=\"width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; margin-bottom:16px;\">\n              <span style=\"width:8px; height:8px; border-radius:50%; background:#5a5a5a; animation:ssPulse 1.8s ease-in-out infinite;\"><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:14px; font-weight:500; margin-bottom:6px;\">Waiting for friends<\u002Fdiv>\n            <div style=\"font-size:12.5px; color:#7a7a7a; line-height:1.55; margin-bottom:16px;\">Send them the room link so they can join.<\u002Fdiv>\n            <div class=\"ss-mono\" style=\"font-size:18px; letter-spacing:.2em; color:#ededed; margin-bottom:14px;\">{{ code }}<\u002Fdiv>\n            <button onclick=\"{{ copyLink }}\" style=\"width:100%; background:#1d1d1d; border:1px solid rgba(255,255,255,.12); border-radius:9px; padding:10px; color:#ededed; cursor:pointer; font-size:13px; font-weight:500;\" style-hover=\"background:#262626;\">{{ copyLinkLabelLong }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <button onclick=\"{{ addViewer }}\" class=\"ss-mono\" style=\"font-size:11px; color:#6a6a6a; background:none; border:1px dashed rgba(255,255,255,.1); border-radius:8px; padding:8px; cursor:pointer;\" style-hover=\"color:#9a9a9a;\">+ simulate a friend joining<\u002Fbutton>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============================================================ VIEWER -->\n  <sc-if value=\"{{ isViewer }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"viewer\" style=\"flex:1; display:flex; flex-direction:column; min-height:0; background:#000; animation:ssFade .4s ease both; {{ viewerCursorStyle }}\">\n    <!-- top bar -->\n    <header style=\"display:flex; align-items:center; justify-content:space-between; padding:14px 22px; flex-shrink:0; {{ viewerChromeStyle }}\">\n      <div style=\"display:flex; align-items:center; gap:14px;\">\n        <button onclick=\"{{ leaveViewer }}\" class=\"ss-mono\" style=\"background:#161616; border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:7px 12px; color:#cfcfcf; cursor:pointer; font-size:12px;\" style-hover=\"background:#222;\">← leave<\u002Fbutton>\n        <div style=\"display:flex; align-items:center; gap:9px;\">\n          <span class=\"ss-mono\" style=\"width:30px; height:30px; border-radius:8px; background:#222; display:flex; align-items:center; justify-content:center; font-size:11px; color:#cfcfcf;\">JB<\u002Fspan>\n          <div>\n            <div style=\"font-size:13px; font-weight:600; line-height:1.1;\">joany's screen<\u002Fdiv>\n            <div class=\"ss-mono\" style=\"font-size:10px; color:#8a8a8a;\">room {{ code }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:8px;\">\n        <sc-if value=\"{{ viewerConnected }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; align-items:center; gap:7px; padding:5px 11px; background:rgba(244,91,91,.12); border:1px solid rgba(244,91,91,.3); border-radius:999px;\">\n            <span style=\"width:7px; height:7px; border-radius:50%; background:#f45b5b; animation:ssPulse 1.6s ease-in-out infinite;\"><\u002Fspan>\n            <span class=\"ss-mono\" style=\"font-size:11px; color:#f4a0a0;\">LIVE<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ viewerReconnecting }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; align-items:center; gap:7px; padding:5px 11px; background:rgba(232,197,106,.12); border:1px solid rgba(232,197,106,.28); border-radius:999px;\">\n            <span style=\"width:11px; height:11px; border:2px solid rgba(232,197,106,.4); border-top-color:#e8c56a; border-radius:50%; animation:ssSpin .8s linear infinite; display:block;\"><\u002Fspan>\n            <span class=\"ss-mono\" style=\"font-size:11px; color:#e8c56a;\">reconnecting…<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div class=\"ss-mono\" style=\"display:flex; align-items:center; gap:7px; font-size:11px; color:#8a8a8a; padding:6px 11px; background:#131313; border:1px solid rgba(255,255,255,.08); border-radius:8px;\">\n          <span style=\"width:6px; height:6px; border-radius:50%; background:{{ connDot }}; display:block;\"><\u002Fspan>\n          {{ connLabel }}\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- stage -->\n    <div style=\"flex:1; position:relative; min-height:0; display:flex; align-items:center; justify-content:center;\">\n      <!-- LIVE / RECONNECTING: show stream -->\n      <sc-if value=\"{{ viewerHasFlux }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute; inset:0;\">\n          <x-import component-from-global-scope=\"image-slot\" id=\"viewer-stage\" shape=\"rect\" fit=\"contain\" placeholder=\"host's stream — drop a screenshot\" hint-size=\"100%,100%\"><\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- reconnecting overlay -->\n      <sc-if value=\"{{ viewerReconnecting }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute; inset:0; background:rgba(6,6,6,.66); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; backdrop-filter:blur(2px);\">\n          <span style=\"width:34px; height:34px; border:3px solid rgba(232,197,106,.3); border-top-color:#e8c56a; border-radius:50%; animation:ssSpin .8s linear infinite; display:block;\"><\u002Fspan>\n          <div style=\"font-size:15px; font-weight:500; color:#e8c56a;\">Reconnecting…<\u002Fdiv>\n          <div class=\"ss-mono\" style=\"font-size:12px; color:#8a8a8a;\">the stream resumes automatically<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- paused -->\n      <sc-if value=\"{{ viewerPaused }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:center; max-width:420px; padding:30px;\">\n          <div style=\"width:60px; height:60px; margin:0 auto 22px; border-radius:16px; background:#141414; border:1px solid rgba(232,197,106,.24); display:flex; align-items:center; justify-content:center; gap:5px;\">\n            <span style=\"width:5px; height:20px; background:#e8c56a; border-radius:2px; display:block;\"><\u002Fspan><span style=\"width:5px; height:20px; background:#e8c56a; border-radius:2px; display:block;\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:20px; font-weight:600; margin-bottom:8px;\">The host paused the share<\u002Fdiv>\n          <div style=\"font-size:14px; color:#8a8a8a; line-height:1.55;\">You're still in the room. The stream resumes as soon as joany resumes sharing.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ended -->\n      <sc-if value=\"{{ viewerEnded }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:center; max-width:420px; padding:30px;\">\n          <div style=\"width:60px; height:60px; margin:0 auto 22px; border-radius:16px; background:#141414; border:1px solid rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center;\">\n            <span style=\"width:18px; height:18px; background:#9a9a9a; border-radius:3px; display:block;\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:20px; font-weight:600; margin-bottom:8px;\">The host stopped sharing<\u002Fdiv>\n          <div style=\"font-size:14px; color:#8a8a8a; line-height:1.55; margin-bottom:24px;\">The session has ended. Thanks for watching — you can join another room whenever you like.<\u002Fdiv>\n          <button onclick=\"{{ leaveViewer }}\" style=\"background:#f2f2f0; color:#0a0a0a; border:none; border-radius:10px; padding:12px 24px; font-size:14px; font-weight:600; cursor:pointer;\" style-hover=\"background:#ffffff;\">Back to home<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- error P2P -->\n      <sc-if value=\"{{ viewerError }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:center; max-width:440px; padding:30px;\">\n          <div style=\"width:60px; height:60px; margin:0 auto 22px; border-radius:16px; background:rgba(244,91,91,.1); border:1px solid rgba(244,91,91,.28); display:flex; align-items:center; justify-content:center;\">\n            <span style=\"font-size:26px; color:#f45b5b; line-height:1;\">!<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:20px; font-weight:600; margin-bottom:8px;\">Direct connection failed<\u002Fdiv>\n          <div style=\"font-size:14px; color:#8a8a8a; line-height:1.55; margin-bottom:24px;\">Your network (or the host's) is too restrictive to establish a direct peer-to-peer connection. Try another network, or ask the host to retry.<\u002Fdiv>\n          <div style=\"display:flex; gap:10px; justify-content:center;\">\n            <button onclick=\"{{ retryConnect }}\" style=\"background:#f2f2f0; color:#0a0a0a; border:none; border-radius:10px; padding:11px 20px; font-size:13px; font-weight:600; cursor:pointer;\" style-hover=\"background:#ffffff;\">Retry<\u002Fbutton>\n            <button onclick=\"{{ leaveViewer }}\" style=\"background:#1d1d1d; border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:11px 20px; color:#cfcfcf; font-size:13px; cursor:pointer;\" style-hover=\"background:#262626;\">Back to home<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- stats overlay (only when stream live + chrome visible) -->\n      <sc-if value=\"{{ showStatsOverlay }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"ss-mono\" style=\"position:absolute; top:16px; right:16px; background:rgba(10,10,10,.82); border:1px solid rgba(255,255,255,.1); border-radius:11px; padding:14px 16px; min-width:190px; backdrop-filter:blur(10px); pointer-events:none; transition:opacity .3s ease;\">\n          <div style=\"font-size:10px; letter-spacing:.1em; color:#6a6a6a; margin-bottom:11px;\">CONNECTION STATS<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:8px;\">\n            <div style=\"display:flex; justify-content:space-between; font-size:12px;\"><span style=\"color:#8a8a8a;\">latency<\u002Fspan><span style=\"color:{{ latencyColor }};\">{{ latency }} ms<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; font-size:12px;\"><span style=\"color:#8a8a8a;\">framerate<\u002Fspan><span>{{ statFps }} fps<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; font-size:12px;\"><span style=\"color:#8a8a8a;\">bitrate<\u002Fspan><span>{{ statBitrate }} mbps<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; font-size:12px;\"><span style=\"color:#8a8a8a;\">resolution<\u002Fspan><span>{{ viewerRes }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; font-size:12px;\"><span style=\"color:#8a8a8a;\">packet loss<\u002Fspan><span>{{ packetLoss }}%<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <!-- VIEWER CONTROL BAR -->\n    <sc-if value=\"{{ viewerHasControls }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex-shrink:0; padding:14px 22px 20px; {{ viewerChromeStyle }}\">\n      <div style=\"display:flex; align-items:center; gap:14px; padding:11px 16px; background:rgba(19,19,19,.9); border:1px solid rgba(255,255,255,.09); border-radius:14px; backdrop-filter:blur(10px); flex-wrap:wrap;\">\n        <!-- volume -->\n        <button onclick=\"{{ toggleMute }}\" style=\"background:none; border:none; cursor:pointer; color:#ededed; display:flex; align-items:center; gap:2px; padding:4px;\">\n          <span style=\"width:0; height:0; border-top:6px solid transparent; border-bottom:6px solid transparent; border-right:9px solid currentColor; display:block; opacity:{{ volGlyph }};\"><\u002Fspan>\n          <span style=\"width:5px; height:11px; background:currentColor; border-radius:2px; display:block; opacity:{{ volGlyph }};\"><\u002Fspan>\n        <\u002Fbutton>\n        <input type=\"range\" min=\"0\" max=\"100\" value=\"{{ volume }}\" oninput=\"{{ onVolume }}\" style=\"width:110px; accent-color:#ededed; cursor:pointer;\">\n        <span class=\"ss-mono\" style=\"font-size:11px; color:#8a8a8a; width:44px;\">{{ volumeLabel }}<\u002Fspan>\n\n        <div style=\"width:1px; height:24px; background:rgba(255,255,255,.09);\"><\u002Fdiv>\n\n        <!-- quality tiers (dynamic) -->\n        <div class=\"ss-mono\" style=\"display:flex; align-items:center; gap:6px; flex-wrap:wrap;\">\n          <span style=\"font-size:11px; color:#6a6a6a;\">quality<\u002Fspan>\n          <sc-for list=\"{{ qualityOptions }}\" as=\"q\" hint-placeholder-count=\"4\">\n            <button onclick=\"{{ q.onClick }}\" style=\"{{ q.style }}\">{{ q.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"flex:1;\"><\u002Fdiv>\n\n        <button onclick=\"{{ toggleStats }}\" style=\"{{ statsBtnStyle }}\" class=\"ss-mono\" style-hover=\"border-color:rgba(255,255,255,.24);\">stats<\u002Fbutton>\n        <button onclick=\"{{ togglePip }}\" title=\"picture in picture\" style=\"background:#1d1d1d; border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:8px 10px; cursor:pointer; display:flex; align-items:center; justify-content:center;\" style-hover=\"border-color:rgba(255,255,255,.24);\">\n          <span style=\"position:relative; width:17px; height:13px; border:1.5px solid #cfcfcf; border-radius:2px; display:block;\"><span style=\"position:absolute; right:1px; bottom:1px; width:8px; height:6px; background:#cfcfcf; border-radius:1px;\"><\u002Fspan><\u002Fspan>\n        <\u002Fbutton>\n        <button onclick=\"{{ toggleFs }}\" title=\"fullscreen\" style=\"background:#1d1d1d; border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:8px 10px; cursor:pointer;\" style-hover=\"border-color:rgba(255,255,255,.24);\">\n          <span style=\"position:relative; width:15px; height:15px; display:block;\">\n            <span style=\"position:absolute; top:0; left:0; width:6px; height:6px; border-top:1.5px solid #cfcfcf; border-left:1.5px solid #cfcfcf;\"><\u002Fspan>\n            <span style=\"position:absolute; top:0; right:0; width:6px; height:6px; border-top:1.5px solid #cfcfcf; border-right:1.5px solid #cfcfcf;\"><\u002Fspan>\n            <span style=\"position:absolute; bottom:0; left:0; width:6px; height:6px; border-bottom:1.5px solid #cfcfcf; border-left:1.5px solid #cfcfcf;\"><\u002Fspan>\n            <span style=\"position:absolute; bottom:0; right:0; width:6px; height:6px; border-bottom:1.5px solid #cfcfcf; border-right:1.5px solid #cfcfcf;\"><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============================================================ SETTINGS MODAL (source + quality) -->\n  <sc-if value=\"{{ pickerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed; inset:0; z-index:150; background:rgba(6,6,6,.72); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:30px; animation:ssScrim .2s ease both;\" onclick=\"{{ closePicker }}\">\n    <div onclick=\"{{ stopProp }}\" style=\"width:100%; max-width:620px; max-height:88vh; overflow:auto; background:#121212; border:1px solid rgba(255,255,255,.11); border-radius:18px; animation:ssModal .28s cubic-bezier(.2,.8,.2,1) both;\">\n      <!-- header -->\n      <div style=\"display:flex; align-items:center; justify-content:space-between; padding:22px 24px 18px; border-bottom:1px solid rgba(255,255,255,.07);\">\n        <div>\n          <div style=\"font-size:18px; font-weight:600;\">Sharing settings<\u002Fdiv>\n          <div class=\"ss-mono\" style=\"font-size:12px; color:#8a8a8a; margin-top:3px;\">source, quality and audio<\u002Fdiv>\n        <\u002Fdiv>\n        <button onclick=\"{{ closePicker }}\" style=\"background:#1d1d1d; border:1px solid rgba(255,255,255,.1); border-radius:8px; width:32px; height:32px; color:#cfcfcf; cursor:pointer; font-size:16px;\" style-hover=\"background:#262626;\">✕<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"padding:20px 24px 8px; display:flex; flex-direction:column; gap:20px;\">\n        <!-- source row -->\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:16px;\">\n          <div>\n            <div style=\"font-size:13px; color:#cfcfcf; margin-bottom:2px;\">Source<\u002Fdiv>\n            <div class=\"ss-mono\" style=\"font-size:12px; color:{{ sourceHintColor }};\">{{ sourceHint }}<\u002Fdiv>\n          <\u002Fdiv>\n          <button onclick=\"{{ chooseSource }}\" style=\"background:#1d1d1d; border:1px solid rgba(255,255,255,.12); border-radius:9px; padding:9px 15px; color:#ededed; cursor:pointer; font-size:13px; font-weight:500;\" style-hover=\"background:#262626;\">{{ changeSourceLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"height:1px; background:rgba(255,255,255,.07);\"><\u002Fdiv>\n\n        <div class=\"ss-mono\" style=\"font-size:10px; letter-spacing:.12em; color:#6a6a6a;\">QUALITY<\u002Fdiv>\n\n        <!-- presets -->\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:16px;\">\n          <span style=\"font-size:13px; color:#cfcfcf;\">Preset<\u002Fspan>\n          <div style=\"display:inline-flex; gap:6px;\">\n            <sc-for list=\"{{ presetOptions }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <button onclick=\"{{ p.onClick }}\" style=\"{{ p.style }}\">{{ p.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- resolution -->\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:16px;\">\n          <span style=\"font-size:13px; color:#cfcfcf;\">Resolution<\u002Fspan>\n          <div class=\"ss-mono\" style=\"display:inline-flex; gap:3px; padding:3px; background:#0d0d0d; border:1px solid rgba(255,255,255,.08); border-radius:9px;\">\n            <sc-for list=\"{{ resOptions }}\" as=\"r\" hint-placeholder-count=\"4\">\n              <button onclick=\"{{ r.onClick }}\" style=\"{{ r.style }}\">{{ r.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- fps -->\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:16px;\">\n          <span style=\"font-size:13px; color:#cfcfcf;\">Framerate<\u002Fspan>\n          <div class=\"ss-mono\" style=\"display:inline-flex; gap:3px; padding:3px; background:#0d0d0d; border:1px solid rgba(255,255,255,.08); border-radius:9px;\">\n            <sc-for list=\"{{ fpsOptions }}\" as=\"f\" hint-placeholder-count=\"4\">\n              <button onclick=\"{{ f.onClick }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- bitrate -->\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:16px;\">\n          <span style=\"font-size:13px; color:#cfcfcf;\">Bitrate<\u002Fspan>\n          <div style=\"display:flex; align-items:center; gap:12px; flex:1; max-width:320px;\">\n            <input type=\"range\" min=\"2\" max=\"60\" value=\"{{ bitrateNum }}\" oninput=\"{{ onBitrate }}\" style=\"flex:1; accent-color:#ededed; cursor:pointer;\">\n            <span class=\"ss-mono\" style=\"font-size:12px; color:#cfcfcf; width:64px; text-align:right;\">{{ bitrate }} mbps<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- cursor toggle -->\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:16px;\">\n          <div>\n            <div style=\"font-size:13px; color:#cfcfcf;\">Show cursor<\u002Fdiv>\n            <div class=\"ss-mono\" style=\"font-size:11px; color:#6a6a6a; margin-top:2px;\">capture the pointer in the stream<\u002Fdiv>\n          <\u002Fdiv>\n          <button onclick=\"{{ toggleCursor }}\" style=\"{{ cursorSwitch }}\"><span style=\"{{ cursorKnob }}\"><\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"height:1px; background:rgba(255,255,255,.07);\"><\u002Fdiv>\n\n        <!-- audio -->\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:16px;\">\n          <span style=\"font-size:13px; color:#cfcfcf;\">Audio<\u002Fspan>\n          <div style=\"display:flex; gap:8px;\">\n            <button onclick=\"{{ toggleSysAudio }}\" style=\"{{ sysAudioStyle }}\" style-hover=\"border-color:rgba(255,255,255,.24);\"><span style=\"display:flex; align-items:center; gap:7px;\"><span style=\"width:8px; height:8px; border-radius:50%; background:currentColor; display:block; opacity:.9;\"><\u002Fspan>system<\u002Fspan><\u002Fbutton>\n            <button onclick=\"{{ toggleMic }}\" style=\"{{ micStyle }}\" style-hover=\"border-color:rgba(255,255,255,.24);\"><span style=\"display:flex; align-items:center; gap:7px;\"><span style=\"width:6px; height:11px; border-radius:3px; background:currentColor; display:block; opacity:.9;\"><\u002Fspan>mic<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- footer -->\n      <div style=\"display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 24px 22px; border-top:1px solid rgba(255,255,255,.07); margin-top:6px;\">\n        <div class=\"ss-mono\" style=\"font-size:11px; color:#6a6a6a;\">≈ {{ estUpload }} mbps upload · {{ resolution }} · {{ fps }}fps<\u002Fdiv>\n        <button onclick=\"{{ applySettings }}\" style=\"{{ applyBtnStyle }}\">{{ applyLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'home',\n    hostSharing: false,\n    paused: false,\n    pickerOpen: false,\n    code: '7K2-QP9',\n    resIdx: 2, fpsIdx: 2, bitrateNum: 30, preset: 'gaming',\n    cursor: true,\n    sysAudio: true, mic: false,\n    sourceName: 'Entire screen · 2560×1440',\n    hasSource: false,\n    joinValue: '', joinError: false,\n    pseudo: '', joinCode: '7K2-QP9',\n    copiedLink: false,\n    viewerList: [],\n    muted: false, volume: 72,\n    quality: 'auto',\n    showStats: true,\n    viewerState: 'live',\n    latency: 18, statFps: 60, statBitrate: 23, packetLoss: 0.1,\n    elapsedSec: 0,\n    uiActive: true,\n  };\n\n  RES = ['720p', '1080p', '1440p', '4K'];\n  FPS = ['10', '30', '60', '120'];\n  PRESETS = {\n    gaming: { res: 2, fps: 2, br: 30 },\n    bureau: { res: 1, fps: 0, br: 6 },\n    cine:   { res: 3, fps: 2, br: 45 },\n  };\n  POOL = [\n    { id: 'alex', name: 'alex', initials: 'AL' },\n    { id: 'marie', name: 'marie', initials: 'MA' },\n    { id: 'thomas', name: 'thomas', initials: 'TH' },\n    { id: 'lea', name: 'lea', initials: 'LE' },\n    { id: 'sam', name: 'sam', initials: 'SA' },\n  ];\n\n  componentDidMount() {\n    this._t = setInterval(() => {\n      const s = this.state;\n      if (s.screen === 'host' && s.hostSharing && !s.paused) {\n        this.setState({ elapsedSec: s.elapsedSec + 1 });\n      }\n      if (s.screen === 'viewer' && s.viewerState === 'live') {\n        const jit = (b, a) => Math.max(0, Math.round((b + (Math.random() - 0.5) * a) * 10) / 10);\n        this.setState({\n          latency: Math.round(jit(19, 8)),\n          statBitrate: Math.round(jit(23, 6)),\n          packetLoss: jit(0.2, 0.6),\n        });\n      }\n    }, 1000);\n    // Auto-hide viewer chrome (YouTube-style): visible only while the pointer\n    // is on the page and has moved in the last 3s; hidden on blur.\n    this._poke = () => {\n      clearTimeout(this._uiT);\n      if (!this.state.uiActive) this.setState({ uiActive: true });\n      this._uiT = setTimeout(() => {\n        if (this.state.screen === 'viewer') this.setState({ uiActive: false });\n      }, 3000);\n    };\n    this._blur = () => { clearTimeout(this._uiT); if (this.state.uiActive) this.setState({ uiActive: false }); };\n    window.addEventListener('mousemove', this._poke);\n    window.addEventListener('mousedown', this._poke);\n    window.addEventListener('keydown', this._poke);\n    window.addEventListener('focus', this._poke);\n    window.addEventListener('blur', this._blur);\n  }\n  componentDidUpdate(prevProps, prevState) {\n    if (this.state.screen === 'viewer' && prevState.screen !== 'viewer') this._poke();\n  }\n  componentWillUnmount() {\n    clearInterval(this._t); clearTimeout(this._uiT);\n    window.removeEventListener('mousemove', this._poke);\n    window.removeEventListener('mousedown', this._poke);\n    window.removeEventListener('keydown', this._poke);\n    window.removeEventListener('focus', this._poke);\n    window.removeEventListener('blur', this._blur);\n  }\n\n  ALPHABET = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'; // Crockford base32 (no I L O U)\n  genCode() {\n    const p = n => Array.from({ length: n }, () => this.ALPHABET[Math.floor(Math.random() * 32)]).join('');\n    return p(3) + '-' + p(3);\n  }\n  normCode(v) { return (v || '').replace(/[^0-9A-Za-z]/g, '').toUpperCase(); }\n  fmtCode(raw) { const r = raw.slice(0, 6); return r.slice(0, 3) + '-' + r.slice(3, 6); }\n  fmtTime(s) { const m = Math.floor(s / 60), ss = s % 60; return String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0'); }\n\n  seg(active) {\n    const base = 'font-size:12px; padding:7px 13px; border-radius:7px; cursor:pointer; border:1px solid transparent; background:transparent; color:#8a8a8a; font-family:inherit;';\n    const on = 'font-size:12px; padding:7px 13px; border-radius:7px; cursor:pointer; border:1px solid rgba(255,255,255,.12); background:#242424; color:#ededed; font-family:inherit;';\n    return active ? on : base;\n  }\n  toggleBtn(active) {\n    const off = 'font-size:13px; padding:9px 13px; border-radius:9px; cursor:pointer; font-family:inherit; background:#181818; border:1px solid rgba(255,255,255,.08); color:#7a7a7a;';\n    const on = 'font-size:13px; padding:9px 13px; border-radius:9px; cursor:pointer; font-family:inherit; background:#1e2a20; border:1px solid rgba(120,220,150,.28); color:#8fd6a8;';\n    return active ? on : off;\n  }\n  navStyle(active) {\n    return 'font-size:11px; padding:6px 11px; border-radius:999px; cursor:pointer; border:none; font-family:inherit; letter-spacing:.02em; ' +\n      (active ? 'background:#f2f2f0; color:#0a0a0a; font-weight:500;' : 'background:transparent; color:#8a8a8a;');\n  }\n  subStyle(active) {\n    return 'font-size:11px; padding:6px 10px; border-radius:999px; cursor:pointer; border:none; font-family:inherit; ' +\n      (active ? 'background:#2a2a2a; color:#ededed;' : 'background:transparent; color:#7a7a7a;');\n  }\n  setManual(patch) { this.setState(Object.assign({ preset: 'custom' }, patch)); }\n\n  renderVals() {\n    const s = this.state;\n    const resolution = this.RES[s.resIdx];\n    const fps = this.FPS[s.fpsIdx];\n    const hostLive = s.hostSharing && !s.paused;\n    const hostPaused = s.hostSharing && s.paused;\n\n    const viewers = s.viewerList.map((v, i) => ({\n      name: v.name, initials: v.initials,\n      ping: (11 + i * 4) + ' ms · good',\n      kick: () => this.setState({ viewerList: s.viewerList.filter(x => x.id !== v.id) }),\n      ban: () => this.setState({ viewerList: s.viewerList.filter(x => x.id !== v.id) }),\n    }));\n\n    // ---- prototype switcher ----\n    const mainDefs = [\n      { key: 'home', label: 'home', apply: () => this.setState({ screen: 'home', pickerOpen: false }) },\n      { key: 'join', label: 'link', apply: () => this.setState({ screen: 'join', pickerOpen: false, joinCode: s.code, pseudo: '' }) },\n      { key: 'host', label: 'host', apply: () => this.setState({ screen: 'host', hostSharing: false, paused: false, pickerOpen: false, hasSource: false }) },\n      { key: 'viewer', label: 'viewer', apply: () => this.setState({ screen: 'viewer', viewerState: 'live', pickerOpen: false, uiActive: true }) },\n    ];\n    const navMain = mainDefs.map(n => ({ label: n.label, onClick: n.apply, style: this.navStyle(s.screen === n.key) }));\n\n    let navSub = [];\n    if (s.screen === 'host') {\n      const activeSub = s.pickerOpen ? 'settings' : (!s.hostSharing ? 'source' : (s.paused ? 'paused' : 'live'));\n      const subDefs = [\n        { key: 'source', label: 'source', apply: () => this.setState({ hostSharing: false, paused: false, pickerOpen: false, hasSource: false }) },\n        { key: 'live', label: 'live', apply: () => this.setState({ hostSharing: true, paused: false, hasSource: true, pickerOpen: false, viewerList: this.POOL.slice(0, 3) }) },\n        { key: 'paused', label: 'paused', apply: () => this.setState({ hostSharing: true, paused: true, hasSource: true, pickerOpen: false }) },\n        { key: 'settings', label: 'settings', apply: () => this.setState({ pickerOpen: true }) },\n      ];\n      navSub = subDefs.map(n => ({ label: n.label, onClick: n.apply, style: this.subStyle(activeSub === n.key) }));\n    } else if (s.screen === 'viewer') {\n      const subDefs = [\n        { key: 'live', label: 'live', apply: () => this.setState({ viewerState: 'live', uiActive: true }) },\n        { key: 'paused', label: 'paused', apply: () => this.setState({ viewerState: 'paused', uiActive: true }) },\n        { key: 'reconnecting', label: 'reconnecting', apply: () => this.setState({ viewerState: 'reconnecting', uiActive: true }) },\n        { key: 'ended', label: 'host stopped', apply: () => this.setState({ viewerState: 'ended', uiActive: true }) },\n        { key: 'error', label: 'p2p error', apply: () => this.setState({ viewerState: 'error', uiActive: true }) },\n      ];\n      navSub = subDefs.map(n => ({ label: n.label, onClick: n.apply, style: this.subStyle(s.viewerState === n.key) }));\n    }\n\n    // ---- settings ----\n    const presetDefs = [{ k: 'gaming', l: 'Gaming' }, { k: 'bureau', l: 'Office' }, { k: 'cine', l: 'Cinema' }];\n    const presetOptions = presetDefs.map(p => ({\n      label: p.l,\n      onClick: () => { const c = this.PRESETS[p.k]; this.setState({ preset: p.k, resIdx: c.res, fpsIdx: c.fps, bitrateNum: c.br }); },\n      style: (s.preset === p.k\n        ? 'font-size:12px; padding:8px 13px; border-radius:8px; cursor:pointer; font-family:inherit; background:#f2f2f0; color:#0a0a0a; border:none; font-weight:600;'\n        : 'font-size:12px; padding:8px 13px; border-radius:8px; cursor:pointer; font-family:inherit; background:#181818; color:#cfcfcf; border:1px solid rgba(255,255,255,.1);'),\n    }));\n    const resOptions = this.RES.map((r, i) => ({ label: r, onClick: () => this.setManual({ resIdx: i }), style: this.seg(i === s.resIdx) }));\n    const fpsOptions = this.FPS.map((f, i) => ({ label: f, onClick: () => this.setManual({ fpsIdx: i }), style: this.seg(i === s.fpsIdx) }));\n\n    // ---- viewer quality tiers (dynamic from host res; floor 720p) ----\n    const tierDefs = [\n      { k: 'source', l: 'Source', min: -1 },\n      { k: 'auto', l: 'Auto', min: -1 },\n      { k: '1440p', l: '1440p', min: 2 },\n      { k: '1080p', l: '1080p', min: 1 },\n      { k: '720p', l: '720p', min: 0 },\n    ];\n    const qualityOptions = tierDefs\n      .filter(t => t.min < 0 || s.resIdx >= t.min)\n      .map(t => ({ label: t.l, onClick: () => this.setState({ quality: t.k }), style: this.seg(s.quality === t.k) }));\n    let viewerRes = resolution;\n    if (['1440p', '1080p', '720p'].includes(s.quality)) viewerRes = s.quality;\n\n    const estUpload = Math.round(s.bitrateNum * (fps === '120' ? 1.35 : fps === '60' ? 1 : fps === '30' ? 0.85 : 0.55) * (resolution === '4K' ? 1.4 : 1));\n    const latencyColor = s.latency < 30 ? '#7fd6a0' : (s.latency < 70 ? '#e8c56a' : '#f45b5b');\n    const conn = s.viewerState === 'error' ? { l: 'disconnected', d: '#f45b5b' }\n      : s.viewerState === 'reconnecting' ? { l: 'unstable', d: '#e8c56a' }\n      : (s.latency < 30 ? { l: 'excellent connection', d: '#7fd6a0' } : { l: 'stable connection', d: '#e8c56a' });\n\n    const switchBase = 'position:relative; width:42px; height:24px; border-radius:999px; cursor:pointer; border:none; transition:background .15s; ';\n    const knobBase = 'position:absolute; top:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .15s; ';\n\n    // viewer chrome auto-hide\n    const chromeHidden = s.screen === 'viewer' && !s.uiActive;\n    const viewerChromeStyle = 'transition:opacity .35s ease;' + (chromeHidden ? ' opacity:0; pointer-events:none;' : ' opacity:1;');\n    const viewerCursorStyle = chromeHidden ? 'cursor:none;' : '';\n\n    return {\n      // screen flags\n      isHome: s.screen === 'home', isJoin: s.screen === 'join',\n      isHost: s.screen === 'host', isViewer: s.screen === 'viewer',\n      hostSharing: s.hostSharing, hostLive, hostPaused, hostEmpty: !s.hostSharing,\n      pickerOpen: s.pickerOpen,\n\n      // switcher\n      navMain, navSub, hasSub: navSub.length > 0,\n\n      // home\n      joinValue: s.joinValue,\n      onJoinInput: e => this.setState({ joinValue: e.target.value.toUpperCase(), joinError: false }),\n      joinError: s.joinError,\n      startShare: () => this.setState({ screen: 'host', hostSharing: false, paused: false, hasSource: false, pickerOpen: false, code: this.genCode(), viewerList: [] }),\n      joinShare: () => {\n        const n = this.normCode(s.joinValue);\n        if (n.length >= 6) this.setState({ screen: 'join', joinCode: this.fmtCode(n), joinError: false, pseudo: '' });\n        else this.setState({ joinError: true });\n      },\n\n      // join screen\n      joinCode: s.joinCode, pseudo: s.pseudo,\n      onPseudo: e => this.setState({ pseudo: e.target.value }),\n      doJoin: () => { if (s.pseudo.trim()) this.setState({ screen: 'viewer', viewerState: 'live', code: s.joinCode, uiActive: true }); },\n      joinBtnStyle: 'width:100%; border:none; border-radius:11px; padding:14px; font-size:15px; font-weight:600; cursor:pointer; ' +\n        (s.pseudo.trim() ? 'background:#f2f2f0; color:#0a0a0a;' : 'background:#2a2a2a; color:#6a6a6a; cursor:not-allowed;'),\n      backHome: e => { if (e && e.preventDefault) e.preventDefault(); this.setState({ screen: 'home' }); },\n\n      // code / link\n      code: s.code,\n      copyLink: () => {\n        try { navigator.clipboard && navigator.clipboard.writeText('https://stream.sh/#' + s.code.replace('-', '')); } catch (e) {}\n        this.setState({ copiedLink: true }); clearTimeout(this._c);\n        this._c = setTimeout(() => this.setState({ copiedLink: false }), 1600);\n      },\n      copyLinkLabel: s.copiedLink ? 'link copied ✓' : 'copy link',\n      copyLinkColor: s.copiedLink ? '#7fd6a0' : '#8a8a8a',\n      copyLinkLabelLong: s.copiedLink ? 'link copied to clipboard ✓' : 'copy invite link',\n\n      // host controls\n      resolution, fps, bitrate: String(s.bitrateNum), bitrateNum: s.bitrateNum,\n      onBitrate: e => this.setManual({ bitrateNum: parseInt(e.target.value, 10) }),\n      sourceName: s.sourceName,\n      sourceBtnLabel: s.hasSource ? s.sourceName.split(' · ')[0] : 'Choose source',\n      sourceHint: s.hasSource ? s.sourceName : 'No source selected yet',\n      sourceHintColor: s.hasSource ? '#8a8a8a' : '#e8c56a',\n      changeSourceLabel: s.hasSource ? 'Change source' : 'Choose source',\n      chooseSource: () => this.setState({ hasSource: true, sourceName: 'Entire screen · 2560×1440' }),\n      elapsed: this.fmtTime(s.elapsedSec),\n      openPicker: () => this.setState({ pickerOpen: true }),\n      closePicker: () => this.setState({ pickerOpen: false }),\n      applySettings: () => { if (s.hasSource) this.setState({ pickerOpen: false, hostSharing: true, paused: false, elapsedSec: s.hostSharing ? s.elapsedSec : 0 }); },\n      applyLabel: s.hostSharing ? 'Apply' : 'Start sharing',\n      applyBtnStyle: 'border:none; border-radius:9px; padding:11px 22px; font-size:13px; font-weight:600; cursor:pointer; ' +\n        (s.hasSource ? 'background:#f2f2f0; color:#0a0a0a;' : 'background:#2a2a2a; color:#6a6a6a; cursor:not-allowed;'),\n      stopProp: e => e.stopPropagation(),\n      togglePause: () => this.setState({ paused: !s.paused }),\n      pauseLabel: s.paused ? 'Resume' : 'Pause',\n      pauseGlyph: s.paused\n        ? 'width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid currentColor;display:block;'\n        : 'width:8px;height:11px;border-left:3px solid currentColor;border-right:3px solid currentColor;display:block;',\n      stopSharing: () => this.setState({ hostSharing: false, paused: false, hasSource: false, elapsedSec: 0 }),\n      presetOptions, resOptions, fpsOptions,\n      cursor: s.cursor, toggleCursor: () => this.setState({ cursor: !s.cursor }),\n      cursorSwitch: switchBase + (s.cursor ? 'background:#4a7a5a;' : 'background:#2a2a2a;'),\n      cursorKnob: knobBase + (s.cursor ? 'left:21px;' : 'left:3px;'),\n      sysAudioStyle: this.toggleBtn(s.sysAudio), micStyle: this.toggleBtn(s.mic),\n      toggleSysAudio: () => this.setState({ sysAudio: !s.sysAudio }),\n      toggleMic: () => this.setState({ mic: !s.mic }),\n      estUpload,\n\n      // viewers\n      viewers, viewerCount: s.viewerList.length,\n      hasViewers: s.viewerList.length > 0, noViewers: s.viewerList.length === 0,\n      addViewer: () => { const next = this.POOL.find(p => !s.viewerList.some(v => v.id === p.id)); if (next) this.setState({ viewerList: s.viewerList.concat([next]) }); },\n\n      // viewer screen\n      leaveViewer: () => this.setState({ screen: 'home' }),\n      retryConnect: () => this.setState({ viewerState: 'reconnecting' }),\n      viewerConnected: s.viewerState === 'live',\n      viewerReconnecting: s.viewerState === 'reconnecting',\n      viewerPaused: s.viewerState === 'paused',\n      viewerEnded: s.viewerState === 'ended',\n      viewerError: s.viewerState === 'error',\n      viewerHasFlux: s.viewerState === 'live' || s.viewerState === 'reconnecting',\n      viewerHasControls: s.viewerState === 'live' || s.viewerState === 'reconnecting' || s.viewerState === 'paused',\n      showStatsOverlay: s.showStats && s.viewerState === 'live' && s.uiActive,\n      viewerChromeStyle, viewerCursorStyle,\n      muted: s.muted, volume: s.muted ? 0 : s.volume,\n      volumeLabel: s.muted ? 'muted' : s.volume + '%',\n      volGlyph: s.muted ? '.3' : '1',\n      onVolume: e => this.setState({ volume: parseInt(e.target.value, 10), muted: false }),\n      toggleMute: () => this.setState({ muted: !s.muted }),\n      quality: s.quality, qualityOptions, viewerRes,\n      showStats: s.showStats,\n      statsBtnStyle: (s.showStats\n        ? 'font-size:12px; padding:8px 12px; border-radius:8px; cursor:pointer; background:#242424; border:1px solid rgba(255,255,255,.18); color:#ededed;'\n        : 'font-size:12px; padding:8px 12px; border-radius:8px; cursor:pointer; background:#1d1d1d; border:1px solid rgba(255,255,255,.1); color:#8a8a8a;'),\n      toggleStats: () => this.setState({ showStats: !s.showStats }),\n      togglePip: () => {}, toggleFs: () => {},\n      latency: s.latency, statFps: s.statFps, statBitrate: s.statBitrate, packetLoss: s.packetLoss,\n      latencyColor, connLabel: conn.l, connDot: conn.d,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
