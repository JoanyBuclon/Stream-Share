name: CI & Publish

# Deux modes, un seul workflow.
#
# - **Validation** (push sur master, PR) : le job `quality` seul. Il ne publie rien.
# - **Release** (tag `v*.*.*`) : `quality`, puis `publish` (images web + signaling) et `desktop`
#   (installeur Windows) en parallèle.
#
# La forme `*.*.*` est délibérée : `v*` déclencherait aussi sur `v1` ou `vnext`, dont
# electron-builder ne peut pas faire une version valide.
#
# La validation avant tag avait été retirée. Elle revient parce que le coût était mal placé : sans
# elle, une régression ne se découvre qu'au `git push --tags`, c'est-à-dire quand les trois
# artefacts d'une version sont déjà en train de partir et qu'il faut supprimer puis recréer un tag
# à chaud. Les jobs de publication restent gardés par `startsWith(github.ref, 'refs/tags/')`, donc
# un push sur master ne publie toujours rien.
on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Setup pnpm
        run: npm install -g pnpm

      - name: Install dependencies (web)
        run: pnpm install --frozen-lockfile

      # --ignore-workspace: signaling is a standalone package with its own lockfile;
      # without it the root pnpm-workspace.yaml captures the dir and skips its install.
      - name: Install dependencies (signaling)
        run: pnpm install --frozen-lockfile --ignore-workspace --dir signaling

      - name: Security audit (web)
        run: pnpm audit --audit-level=high

      - name: Security audit (signaling)
        run: pnpm audit --audit-level=high --ignore-workspace --dir signaling

      # Le paquet le plus coûteux à laisser dériver, et le seul qui n'était pas inspecté :
      # `loopback-capture` est un addon natif tiers chargé dans un processus dont le sandbox est
      # volontairement désactivé (cf. rendererSecurity dans electron/src/config.ts).
      #
      # Pas d'étape d'installation avant : `pnpm audit` lit le lockfile, pas node_modules (vérifié
      # sur un dossier ne contenant que package.json + pnpm-lock.yaml). Installer electron ici
      # coûterait plusieurs minutes de runner pour zéro information supplémentaire.
      #
      # Pas de `--ignore-workspace` non plus, et c'est la conséquence directe de
      # electron/pnpm-workspace.yaml : ce fichier fait de electron/ sa propre racine pnpm — donc le
      # flag n'a plus rien à contourner — et il porte les `overrides`. Le passer masquerait ces
      # overrides et l'audit repartirait sur les versions vulnérables.
      - name: Security audit (desktop)
        run: pnpm audit --audit-level=high --dir electron

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test (web lib)
        run: pnpm test

      - name: Test (signaling)
        run: pnpm --ignore-workspace --dir signaling test

      # Pure config logic of the desktop shell — node strips the TS, no electron install needed.
      - name: Test (desktop config)
        run: node --test electron/src/config.test.ts

      # E2E: real host↔viewer WebRTC flow in headless Chromium (Playwright starts the dev +
      # signaling servers itself since CI=true → reuseExistingServer is off).
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (host ↔ viewer)
        run: pnpm e2e

  publish:
    needs: quality
    # La garde de ref revient avec le déclencheur master/PR : `quality` doit tourner sur chaque
    # push, la publication non. Sur un tag, les images web/signaling partent avec la release
    # desktop — les trois artefacts d'une version sortent ensemble.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: stream-share-web
            context: .
            dockerfile: Dockerfile
          - image: stream-share-signaling
            context: ./signaling
            dockerfile: ./signaling/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          # `type=semver` est ce qui rend un rollback possible : sans lui, revenir à la version
          # précédente demandait de retrouver le SHA du commit correspondant dans le log, au pire
          # moment pour le faire. On publie les deux formes — `0.4.3` et `0.4` — plus `latest`
          # (ce que consomme docker-compose.yml) et `sha-` (traçabilité vers le commit exact).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Desktop installer (Windows). Runs only on a semver `vx.y.z` tag, in parallel with `publish`,
  # after `quality`. Builds the web dist, then packages + publishes the .exe (and latest.yml for
  # the auto-updater) to the matching GitHub Release.
  desktop:
    needs: quality
    # Même garde que `publish` : un push sur master valide, il ne publie pas. L'étape ci-dessous
    # vérifie en plus que le tag correspond bien à la version de electron/package.json.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Setup pnpm
        run: npm install -g pnpm

      # electron-builder tags the release from electron/package.json, NOT the pushed tag — a
      # mismatch would publish artefacts to the wrong (or a new) release. Fail loudly instead.
      - name: Check tag matches desktop version
        shell: bash
        run: |
          VER="v$(node -p "require('./electron/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "$VER" ]; then
            echo "Tag ${GITHUB_REF_NAME} != electron/package.json version $VER"; exit 1
          fi

      - name: Install dependencies (web)
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm run build

      # Standalone sub-project with its own lockfile (like signaling). `--ignore-workspace` is gone:
      # electron/pnpm-workspace.yaml now makes this directory its own pnpm root, which is what the
      # flag was emulating — and unlike the flag it can carry `overrides`, which is where the
      # security pins for the desktop tree live. Keeping the flag would drop them and break
      # --frozen-lockfile outright (ERR_PNPM_LOCKFILE_CONFIG_MISMATCH: the lockfile records them).
      #
      # --ignore-scripts stays: electron-builder pulls electron-winstaller, whose install script
      # pnpm refuses to run — it would fail the job. Nothing here needs a lifecycle script: Electron
      # fetches its binary on first run and electron-builder downloads its own toolchain.
      - name: Install dependencies (desktop)
        run: pnpm install --frozen-lockfile --ignore-scripts --dir electron

      # Build and upload are split on purpose. electron-builder's own GitHub publisher reported
      # success while only the .blockmap landed on the release — no installer, no latest.yml —
      # twice. Building with `--publish never` and uploading explicitly makes both steps visible
      # in the log and fails the job when an artefact is missing, instead of shipping a release
      # that looks fine and cannot be installed or updated.
      - name: Build desktop installer
        run: pnpm --dir electron dist

      - name: Show built artefacts
        run: Get-ChildItem electron/release | Select-Object Name, Length | Format-Table -AutoSize

      # `gh` is preinstalled on the runner. Since electron-builder no longer publishes, nothing
      # creates the GitHub Release either — a tag alone doesn't make one — so create it when the
      # tag has none yet. --clobber replaces assets left by an earlier run on the same tag.
      # The three files are exactly what electron-updater needs.
      - name: Upload installer to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Drive control flow with $LASTEXITCODE only: `gh release view` is *expected* to fail
          # when the release doesn't exist yet, and pwsh 7.4+ would otherwise turn that into a
          # terminating error before we can react.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $tag = $env:GITHUB_REF_NAME
          $exe = Get-ChildItem electron/release/*.exe -ErrorAction SilentlyContinue
          $map = Get-ChildItem electron/release/*.blockmap -ErrorAction SilentlyContinue
          $yml = Get-ChildItem electron/release/latest.yml -ErrorAction SilentlyContinue
          if (-not $exe) { throw "no installer in electron/release - nothing to publish" }
          if (-not $yml) { throw "no latest.yml - the auto-updater would be blind" }

          gh release view $tag 1>$null 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "no release for $tag yet - creating it"
            $notes = (git tag -l --format='%(contents)' $tag | Out-String).Trim()
            if ($notes) { gh release create $tag --title $tag --notes $notes }
            else { gh release create $tag --title $tag --generate-notes }
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
          }

          # Checksum publié à côté de l'installeur. À dire honnêtement : l'exécutable n'est PAS
          # signé, et un checksum hébergé sur la même release que le binaire ne protège pas d'une
          # release compromise — les deux tomberaient ensemble. Ce qu'il donne : de quoi vérifier
          # un téléchargement tronqué ou servi par un miroir, et une valeur de référence citable.
          # Il ne remplace pas un certificat de signature de code, il comble le vide en attendant.
          $sum = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$sum  $($exe.Name)" | Out-File -FilePath electron/release/SHA256SUMS.txt -Encoding ascii
          Write-Host "SHA256 $sum"

          gh release upload $tag $exe.FullName $map.FullName $yml.FullName electron/release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)" }
