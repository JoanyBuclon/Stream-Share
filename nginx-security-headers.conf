# Security headers shared by every location. nginx's add_header REPLACES (does not inherit) the
# parent's headers as soon as a location declares one of its own, so a location that sets e.g.
# Cache-Control would otherwise silently drop these — hence a single include used in both blocks.
# HSTS / nosniff / framedeny / referrerPolicy come from Traefik at the edge and cover every response.
# `script-src 'self'` WITHOUT 'unsafe-inline': the Astro build emits no inline script at all
# (measured on dist/index.html and dist/download/index.html — zero <script> with a body, zero on*
# handlers), so the permission only ever widened the blast radius of an XSS. `style-src` keeps it,
# and that asymmetry is deliberate: Astro does emit an inline <style> (the @font-face block) and
# viewer.ts writes element .style directly. Mirrored in electron/src/config.ts — the two must move
# together, and there is a test over there asserting the script-src half.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; media-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# microphone=(self) keeps the optional host mic working; display-capture stays on its default
# 'self' allow-list (do NOT disable it — it powers getDisplayMedia screen share).
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
