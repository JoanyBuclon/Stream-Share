server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets — immutable cache. /_astro/ is the ONLY immutable location: Astro emits
    # every content-hashed file there, fonts included (/_astro/fonts/<hash>.woff2).
    # Do not widen this to an extension regex: it would catch favicon.ico / favicon.svg /
    # apple-touch-icon.png at the root, which are NOT hashed — un an de cache sur une icône
    # qu'on ne peut alors plus changer. Les icônes restent au no-cache du bloc `/`.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf; # add_header replaces, not inherits — re-declare here
    }

    # HTML pages — no-cache + security headers
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf; # CSP + Permissions-Policy (shared, cf. the file)
        try_files $uri $uri/index.html $uri.html =404;
    }
}
