server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets (Vite outputs to /_astro/) — immutable cache
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static public assets — immutable cache
    location ~* \.(ico|svg|webp|png|jpg|jpeg|gif|woff2|woff)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML pages — no-cache + security headers
    location / {
        add_header Cache-Control "no-cache";
        # CSP adapted from Portfolio: connect-src allows the same-origin wss signaling
        # socket (/ws), media-src blob: is required to attach a MediaStream to <video>.
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; media-src 'self' blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        # microphone=(self) keeps the optional host mic working; display-capture stays on its
        # default 'self' allow-list (do NOT disable it — it powers getDisplayMedia screen share).
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
        try_files $uri $uri/index.html $uri.html =404;
    }
}
